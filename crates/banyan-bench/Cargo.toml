[package]
name = "banyan-bench"
description = "Agent-style branching workloads for banyan and a vanilla Postgres baseline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
banyan = { path = "../banyan" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
