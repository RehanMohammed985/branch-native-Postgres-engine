name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint, tests, crash simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Crash simulation, 1,000 seeds
        run: cargo test --release -p banyan-store --test dst -- --nocapture
        env:
          BANYAN_DST_SEEDS: 1000

  e2e:
    name: End to end (real Postgres on a FUSE mount)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FUSE and PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 postgresql postgresql-contrib
      - name: Build
        run: cargo build --release -p banyan
      - name: End-to-end test
        run: tests/e2e.sh target/release/banyan
      - name: Daemon log
        if: failure()
        run: cat /tmp/banyan-e2e.*/daemon.log || true
