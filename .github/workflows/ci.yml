name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint, tests, crash simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Crash simulation, 1,000 seeds
        run: cargo test --release -p banyan-store --test dst -- --nocapture
        env:
          BANYAN_DST_SEEDS: 1000

  e2e:
    name: End to end (real Postgres on a FUSE mount)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FUSE and PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 postgresql postgresql-contrib
      - name: Build
        run: cargo build --release -p banyan
      - name: End-to-end test
        run: tests/e2e.sh target/release/banyan
      - name: Daemon log
        if: failure()
        run: cat /tmp/banyan-e2e.*/daemon.log || true

  image:
    name: Docker image quick start
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t banyan .
      - name: Run the README quick start
        run: |
          docker run -d --name banyan \
            --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined \
            -p 127.0.0.1:15432:5432 -p 127.0.0.1:18432:8432 banyan
          for _ in $(seq 1 120); do docker exec banyan banyan status >/dev/null 2>&1 && break; sleep 0.5; done
          q() { docker exec banyan psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -d "$1" -Atc "$2"; }
          q main "create table notes(id serial primary key, body text)"
          q main "insert into notes(body) values ('written on main')"
          docker exec banyan banyan branch create experiment
          q experiment "insert into notes(body) values ('only on experiment')"
          test "$(q experiment 'select count(*) from notes')" = 2
          test "$(q main 'select count(*) from notes')" = 1
          curl -fsS localhost:18432/v1/branches
          docker exec banyan banyan branch delete experiment
          docker exec banyan banyan gc
      - name: Container log
        if: failure()
        run: docker logs banyan || true
